name: Premove default patch

on: [push]

permissions:
  contents: write

jobs:
  patch-default:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Keep single premove as compatible default
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/src/model/settings/board_preferences.dart')
          s = p.read_text()
          s = s.replace(
              'while fresh installs use the recommended [multiple] default below.',
              'and fresh installs remain [single] until the user opts into multiple premoves.',
          )
          s = s.replace('    multiplePremoves: true,', '    multiplePremoves: false,', 1)
          p.write_text(s)
          PY
      - name: Commit patch when changed
        run: |
          if ! git diff --quiet -- lib/src/model/settings/board_preferences.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/src/model/settings/board_preferences.dart
            git commit -m "Preserve single premove default"
            git push
          fi
