name: Integrate public Board API lobby matchmaking

on: [push]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/multiple-premoves
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Add public matchmaking path
        env:
          PUBLIC_SEEK_HELPER_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('lib/src/model/lobby/create_game_service.dart')
          s = p.read_text()
          anchor = "import 'package:flutter_riverpod/flutter_riverpod.dart';\n"
          if "src/constants.dart" not in s:
              if anchor not in s: raise SystemExit('constants import anchor not found')
              s = s.replace(anchor, anchor + "import 'package:lichess_mobile/src/constants.dart';\n", 1)
          anchor = "  (StreamSubscription<SocketEvent>, Completer<GameSeekResponse>)? _lobbyConnection;\n"
          if "Completer<GameSeekResponse>? _publicLobbySeek;" not in s:
              insert = anchor + "\n  /// Pending public Board API seek. It replaces the official lobby-socket redirect in fork mode.\n  Completer<GameSeekResponse>? _publicLobbySeek;\n"
              if anchor not in s: raise SystemExit('public seek field anchor not found')
              s = s.replace(anchor, insert, 1)
          anchor = "  Future<GameSeekResponse> newLobbyGame(GameSeek seek) async {\n    ref.read(recentGameSeekProvider.notifier).addSeek(seek);\n"
          if "return _newPublicBoardApiLobbyGame(seek);" not in s:
              if anchor not in s: raise SystemExit('newLobbyGame anchor not found')
              s = s.replace(anchor, anchor + "    if (kPublicBoardApiTest) {\n      return _newPublicBoardApiLobbyGame(seek);\n    }\n", 1)
          anchor = "  /// Create a new correspondence game.\n"
          if "_performPublicBoardApiLobbySeek" not in s:
              helper = base64.b64decode(os.environ['PUBLIC_SEEK_HELPER_B64']).decode()
              if anchor not in s: raise SystemExit('helper insertion anchor not found')
              s = s.replace(anchor, helper + anchor, 1)
          old = "  Future<void> cancelSeek() async {\n    if (_lobbyConnection == null) return;\n"
          if "Cancelling public Board API game creation" not in s:
              new = "  Future<void> cancelSeek() async {\n    if (kPublicBoardApiTest && _publicLobbySeek != null) {\n      _log.info('Cancelling public Board API game creation');\n      await LobbyRepository(lichessClient).cancelSeek(sri: sri);\n      if (!_publicLobbySeek!.isCompleted) {\n        _publicLobbySeek!.complete(const GameSeekCancelled());\n      }\n      return;\n    }\n\n    if (_lobbyConnection == null) return;\n"
              if old not in s: raise SystemExit('cancelSeek anchor not found')
              s = s.replace(old, new, 1)
          old = "  void dispose() {\n    _lobbyConnection?.$1.cancel();\n"
          if "final publicSeek = _publicLobbySeek;" not in s:
              new = "  void dispose() {\n    // Riverpod forbids reading ref from onDispose. Public seeks pin this provider with keepAlive;\n    // on forced shutdown simply complete the local future and let the HTTP client tear down.\n    final publicSeek = _publicLobbySeek;\n    if (publicSeek != null && !publicSeek.isCompleted) {\n      publicSeek.complete(const GameSeekCancelled());\n    }\n    _publicLobbySeek = null;\n    _lobbyConnection?.$1.cancel();\n"
              if old not in s: raise SystemExit('dispose anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build
      - name: Format
        run: dart format lib/src/model/lobby/create_game_service.dart test/model/lobby/create_game_service_public_board_api_test.dart
      - name: Analyze
        run: flutter analyze
      - name: Public matchmaking tests
        run: |
          flutter test --dart-define=PUBLIC_BOARD_API_TEST=true test/model/lobby/create_game_service_public_board_api_test.dart
          flutter test --dart-define=PUBLIC_BOARD_API_TEST=true test/model/lobby/create_game_service_test.dart
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/model/lobby/create_game_service.dart test/model/lobby/create_game_service_public_board_api_test.dart
          git commit -m 'Use public Board API for fork lobby matchmaking'
          git push origin HEAD:feature/multiple-premoves
