name: Integrate public game controls

on: [push]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/multiple-premoves
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Patch public game controls
        env:
          PATCH_B64: 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Install dependencies
        run: flutter pub get
      - name: Format
        run: |
          dart format \
            lib/src/model/auth/auth_repository.dart \
            lib/src/model/public_board_api/public_board_api.dart \
            lib/src/view/settings/board_settings_screen.dart \
            lib/src/view/public_board_api/public_board_api_test_screen.dart
      - name: Analyze
        run: flutter analyze
      - name: Targeted tests
        run: |
          flutter test --dart-define=PUBLIC_BOARD_API_TEST=true test/model/public_board_api/public_board_api_test.dart
          flutter test --dart-define=PUBLIC_BOARD_API_TEST=true test/model/lobby/create_game_service_public_board_api_test.dart
          flutter test test/model/settings/board_preferences_test.dart
      - name: Commit integration
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/src/model/auth/auth_repository.dart \
            lib/src/model/public_board_api/public_board_api.dart \
            lib/src/view/settings/board_settings_screen.dart \
            lib/src/view/public_board_api/public_board_api_test_screen.dart
          git commit -m "Add public Board API game controls and clocks"
          git push origin HEAD:feature/multiple-premoves
