name: Premove format fix

on: [push]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: dart format lib/src/widgets/board.dart
      - name: Commit formatting when changed
        run: |
          if ! git diff --quiet -- lib/src/widgets/board.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/src/widgets/board.dart
            git commit -m "Format premove preference listener"
            git push
          fi
