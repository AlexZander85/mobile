name: Fix public game transition

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/multiple-premoves
          fetch-depth: 0
      - name: Route newly matched games to Board API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/src/view/game/game_screen.dart')
          s = p.read_text()
          old = "      case AsyncData(value: GameCreatedState(:final createdGameId)):\n        final isRealTimePlayingGame = ref.watch(\n"
          new = "      case AsyncData(value: GameCreatedState(:final createdGameId)):\n        // A lobby seek completes inside this already-mounted GameScreen, so buildRoute cannot\n        // intercept it. In public fork mode hand the freshly paired game to the documented\n        // Board API transport here before any private /play/.../v6 controller is created.\n        if (kPublicBoardApiTest) {\n          return PublicBoardApiGameLoaderScreen(gameId: createdGameId.gameId.value);\n        }\n\n        final isRealTimePlayingGame = ref.watch(\n"
          if new in s:
              raise SystemExit('patch already applied')
          if old not in s:
              raise SystemExit('GameCreatedState anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/view/game/game_screen.dart
          git commit -m "Route matched games through public Board API"
          git push origin HEAD:feature/multiple-premoves
