name: Format public Board API source

on: [push]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/multiple-premoves
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/src/view/public_board_api/public_board_api_test_screen.dart
      - name: Commit formatter output if needed
        run: |
          if git diff --quiet -- lib/src/view/public_board_api/public_board_api_test_screen.dart; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/view/public_board_api/public_board_api_test_screen.dart
          git commit -m 'Format public Board API test screen'
          git push origin HEAD:feature/multiple-premoves
