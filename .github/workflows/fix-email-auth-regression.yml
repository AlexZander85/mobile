name: Apply narrow email auth regression fix

on: [push]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/multiple-premoves
          fetch-depth: 0
      - name: Restore normal email login flow and fix case-insensitive username match
        run: |
          git fetch origin main
          git show origin/main:lib/src/view/auth/email_login_screen.dart > lib/src/view/auth/email_login_screen.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/src/model/user/user_repository.dart')
          s = p.read_text()
          old = "return names.any((name) => name is String && name == term);"
          new = "return names.any((name) => name is String && name.toLowerCase() == term);"
          if old not in s:
              raise SystemExit('expected username comparison not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/src/view/auth/email_login_screen.dart lib/src/model/user/user_repository.dart
          git commit -m 'Restore email login precheck with case-insensitive matching'
          git push origin HEAD:feature/multiple-premoves
