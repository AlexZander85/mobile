name: Format validation

on:
  push:
    branches:
      - agent/multiple-premoves-mobile

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/multiple-premoves-mobile

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Format changed Dart files
        run: |
          dart format \
            lib/src/model/settings/board_preferences.dart \
            lib/src/view/settings/board_settings_screen.dart \
            lib/src/widgets/board.dart \
            lib/src/widgets/game_layout.dart \
            test/model/settings/board_preferences_test.dart \
            test/widgets/multiple_premove_mode_layout_test.dart \
            test/widgets/multiple_premove_test.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/src/model/settings/board_preferences.dart \
            lib/src/view/settings/board_settings_screen.dart \
            lib/src/widgets/board.dart \
            lib/src/widgets/game_layout.dart \
            test/model/settings/board_preferences_test.dart \
            test/widgets/multiple_premove_mode_layout_test.dart \
            test/widgets/multiple_premove_test.dart
          git commit -m "Apply scoped Dart formatting"
          git push origin HEAD:agent/multiple-premoves-mobile
