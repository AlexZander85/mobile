name: Public Board API ARM64 test APK

on: [push]

permissions: read-all

jobs:
  build-public-board-api-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Checkout mobile code
        uses: actions/checkout@v7.0.1
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Code generation
        run: dart run build_runner build
      - name: Verify formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/main_public_board_api.dart \
            lib/src/constants.dart \
            lib/src/model/auth/bearer.dart \
            lib/src/model/auth/auth_repository.dart \
            lib/src/model/public_board_api/public_board_api.dart \
            lib/src/view/public_board_api/public_board_api_test_screen.dart \
            test/model/public_board_api/public_board_api_test.dart
      - name: Analyze project source
        run: flutter analyze
      - name: Run Board API and premove tests
        run: |
          flutter test test/model/public_board_api/public_board_api_test.dart
          flutter test test/model/settings/board_preferences_test.dart
      - name: Remove fixed ABI filters for Flutter split build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          line = '            abiFilters += listOf("armeabi-v7a", "arm64-v8a", "x86_64")\n'
          if line not in s:
              raise SystemExit('expected abiFilters line not found')
          p.write_text(s.replace(line, ''))
          PY
      - name: Build production Board API ARM64 debug APK
        run: |
          flutter build apk --debug \
            --target lib/main_public_board_api.dart \
            --dart-define=PUBLIC_BOARD_API_TEST=true \
            --dart-define=LICHESS_HOST=lichess.org \
            --dart-define=LICHESS_WS_HOST=socket.lichess.org \
            --target-platform android-arm64 \
            --split-per-abi
      - name: Verify APK contains only ARM64 native libraries
        run: |
          python3 - <<'PY'
          import zipfile
          apk = 'build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk'
          with zipfile.ZipFile(apk) as z:
              abis = sorted({n.split('/')[1] for n in z.namelist() if n.startswith('lib/') and n.endswith('.so')})
          print('Native ABIs:', abis)
          if abis != ['arm64-v8a']:
              raise SystemExit(f'expected ARM64 only, got {abis}')
          PY
      - name: Upload production Board API ARM64 APK
        uses: actions/upload-artifact@v7
        with:
          name: lichess-multiple-premoves-production-board-api-arm64-debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 7
