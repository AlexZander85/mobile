name: Controller owner migration

on:
  push:
    branches:
      - agent/multiple-premoves-mobile

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: agent/multiple-premoves-mobile
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          cache: true
          flutter-version-file: pubspec.yaml

      - name: Restore generic layout and patch controller owner
        run: |
          git fetch origin main
          git checkout origin/main -- lib/src/widgets/game_layout.dart
          rm -f test/widgets/multiple_premove_mode_layout_test.dart
          python3 .github/scripts/tmp_migrate_multiple_premoves.py

      - name: Install dependencies and format
        run: |
          flutter pub get
          dart format lib/src/view/game/game_body.dart

      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/view/game/game_body.dart lib/src/widgets/game_layout.dart pubspec.lock
          git add -u test/widgets/multiple_premove_mode_layout_test.dart
          git commit -m "Scope multiple premoves to live game controller"
          git push origin HEAD:agent/multiple-premoves-mobile
