name: Format public lobby test once

on: [push]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: feature/multiple-premoves
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Format public lobby regression test
        run: dart format test/model/lobby/create_game_service_public_board_api_test.dart
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/model/lobby/create_game_service_public_board_api_test.dart
          if git diff --cached --quiet; then
            echo 'Already formatted'
          else
            git commit -m 'Format public lobby regression test'
            git push origin HEAD:feature/multiple-premoves
          fi
